name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Refuse Minecraft world and server data
        run: git ls-files -z | tr '\0' '\n' | sh scripts/guard-world-data.sh

      - name: Refuse hex colours outside the design tokens
        run: sh scripts/check-hex-colors.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json # engines.node
          cache: npm

      - run: npm ci

      # astro check exits 0 without checking anything in CI if it is missing.
      - name: Assert type-check tooling is installed
        run: test -d node_modules/@astrojs/check && test -d node_modules/typescript

      - run: npm run format:check

      - name: Type check and build
        run: npm run build

      - name: Validate generated HTML
        run: npm run validate:html
